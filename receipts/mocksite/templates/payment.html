{% extends "base.html" %}
{% block title %}Payment · SkyLite Air{% endblock %}
{% block content %}
  <p class="eyebrow">Step 3 of 3 · Payment</p>
  <h1>Complete your booking</h1>
  <p class="intro">{{ state.flight['from'] }} to {{ state.flight['to'] }} · {{ state.flight['date'] }}</p>
  <section class="card">
    <form method="post" action="/pay" autocomplete="off">
      <div class="grid">
        <div class="field"><label for="pay-card">Card number</label><input id="pay-card" name="card_number" type="text" inputmode="numeric" autocomplete="off" data-testid="pay-card" required></div>
        <div class="field"><label for="pay-exp">Expiry date</label><input id="pay-exp" name="expiry" type="text" placeholder="MM/YY" data-testid="pay-exp" required></div>
        <div class="field"><label for="pay-cvc">Security code</label><input id="pay-cvc" name="cvc" type="password" inputmode="numeric" autocomplete="off" data-testid="pay-cvc" required></div>
      </div>
      <div class="primary-row"><button type="submit" data-testid="pay-submit">Pay and book</button></div>
    </form>
  </section>
{% endblock %}
