[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "receipts"
version = "0.1.0"
description = "Evidence-backed completion audits for computer-use agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Ozgur Eryilmaz", email = "ozgureyilmaz@gmail.com"}]
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1,<4",
  "playwright>=1.48,<2", "openai>=2,<3", "python-dotenv>=1,<2",
  "pyyaml>=6,<7", "httpx>=0.27,<1", "python-multipart>=0.0.18,<1",
  "pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["receipts*"]

[tool.setuptools.package-data]
"receipts.mocksite" = ["templates/*.html", "static/*.css"]
"receipts.report" = ["templates/*.html"]
"receipts.bench" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires MODEL_API_KEY and makes paid model calls", "browser: uses local Chromium"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
